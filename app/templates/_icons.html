{# Stroke icons, sized by CSS (svg.i). Usage: {% from "_icons.html" import icon %}{{ icon("home") }} #}
{% macro icon(name, cls="i") -%}
<svg class="{{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "home" -%}<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>
{%- elif name == "cake" -%}<path d="M4 21h16"/><path d="M5 21v-8h14v8"/><path d="M5 16c2.3 1.4 4.7 1.4 7 0s4.7-1.4 7 0"/><path d="M12 13V9"/>
{%- elif name == "group" -%}<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M15 14.5c3 0 6 1.7 6 5.5"/>
{%- elif name == "list" -%}<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
{%- elif name == "user" -%}<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>
{%- elif name == "upload" -%}<path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 20h16"/>
{%- elif name == "calendar" -%}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
{%- elif name == "plus" -%}<path d="M12 5v14M5 12h14"/>
{%- endif -%}
</svg>
{%- endmacro %}
