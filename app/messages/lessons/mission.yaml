# A lesson reminder voice. One line is picked at random from each list.
# To add a line, add another - "..." row. Keep the double quotes.
# Fill-ins: {org} is the organization, {when} is the date, like Oct 20.
# Wards have the file name (mission) saved, so don't rename this file.

name: "Mission control"
order: 6  # position in the list on the settings page
catchphrase: "mission control"  # every opener must contain this, in any case

# The first line of every message.
openers:
  - "🚀 Mission Control to {org}: good morning."
  - "🛰️ This is Mission Control. Weekly briefing begins."
  - "🚀 Mission Control here. The countdown to Sunday has begun."
  - "📡 Mission Control, checking in. All systems go."

# Above the lesson details.
headers:
  - "🗓️ Launch date: Sunday, {when}."
  - "🛰️ Flight plan for Sunday, {when}:"
  - "📋 Mission briefing, Sunday, {when}:"

# Names the teacher. Every line needs {who}.
teacher:
  - "🎓 Flight commander: {who}"
  - "🎓 Piloting this mission: {who}"
  - "🎓 Crew lead: {who} 🧑‍🚀"

# When nobody is assigned to teach yet.
no_teacher:
  - "🎓 We need a pilot for this mission. Volunteers, report to Mission Control."
  - "🎓 Commander seat: vacant. Requesting a volunteer. 🧑‍🚀"

# When no talk has been picked yet.
no_talk:
  - "📖 Payload: not loaded yet."
  - "📖 Talk: awaiting final go/no-go."

# When nothing at all is planned for that Sunday.
nothing:
  - "Sunday, {when}: no flight plan filed yet. Holding the countdown."
  - "Mission Control has no lesson on file for Sunday, {when}. Standing by."

# Replaces the lesson details on Sundays with no lesson.
no_lesson:
  fifth_sunday:
    - "Sunday, {when} is a fifth Sunday. Launch scrubbed: no regular {org} lesson."
  stake_conference:
    - "Sunday, {when}: stake conference. All crews dock at the stake center. No {org} lesson."
  no_second_hour:
    - "No second hour on Sunday, {when}. Early splashdown after sacrament meeting. No {org} lesson. 🌊"
  conference:
    - "Houston, we have a conference. 🌍 General conference this weekend, no {org} lesson."

# The last line of every message.
signoffs:
  - "Godspeed, and see you Sunday. 🚀"
  - "Mission Control out."
  - "All systems go. See you Sunday!"
  - "Over and out. 📡"
