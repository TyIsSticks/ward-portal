# A lesson reminder voice. One line is picked at random from each list.
# To add a line, add another - "..." row. Keep the double quotes.
# Fill-ins: {org} is the organization, {when} is the date, like Oct 20.
# Wards have the file name (beep) saved, so don't rename this file.

name: "Beep-booper"
order: 3  # position in the list on the settings page
catchphrase: "beep boop"  # every opener must contain this, in any case

# The first line of every message.
openers:
  - "🤖 BEEP BOOP. Hello, {org} humans!"
  - "🤖 Beep boop! Weekly lesson protocol activated."
  - "🤖 *whirr* *click* Beep boop. Good morning, {org}!"
  - "🤖 Boop beep? No wait. BEEP BOOP. 🔧"
  - "🤖 Beep. Boop. Beep boop. (That means happy Monday.)"
  - "🤖 Beep boop! Rebooting the week… 100% complete."

# Above the lesson details.
headers:
  - "💾 Loading Sunday, {when}…"
  - "📟 Computing Sunday, {when}:"
  - "🔍 Scanning Sunday, {when}… found:"
  - "🖨️ Printing Sunday, {when}:"

# Names the teacher. Every line needs {who}.
teacher:
  - "🎓 Human teacher: {who}"
  - "🎓 Teaching unit: {who}"
  - "🎓 Teacher detected: {who} ✅"

# When nobody is assigned to teach yet.
no_teacher:
  - "🎓 Teacher: ERROR 404. Human volunteer required. Beep?"
  - "🎓 Teacher: not found. Please insert human. 🪙"

# When no talk has been picked yet.
no_talk:
  - "📖 Talk: still downloading… ⏳"
  - "📖 Talk: NULL. Beep boop. (Not picked yet.)"

# When nothing at all is planned for that Sunday.
nothing:
  - "Computing Sunday, {when}… ERROR: no lesson found. My circuits are confused. 😵‍💫"
  - "Sunday, {when}: lesson file is empty. Beep… boop… sad beep."

# Replaces the lesson details on Sundays with no lesson.
no_lesson:
  fifth_sunday:
    - "Fifth Sunday detected ({when}). No regular {org} lesson. Entering sleep mode. 💤"
    - "Sunday, {when}: fifth Sunday! No {org} lesson. Happy beeps! 🎉"
  stake_conference:
    - "Sunday, {when}: stake conference. No {org} lesson. Rerouting humans to the stake center. 🗺️"
    - "Stake conference on Sunday, {when}. No {org} lesson. Beep boop, see you there."
  no_second_hour:
    - "Sunday, {when}: no second hour. No {org} lesson. Powering down after sacrament meeting. 🔌"
    - "No second hour on Sunday, {when}. {org} lesson.exe will not run."
  conference:
    - "General conference this weekend! No {org} lesson. Charging batteries on the couch. 🔋🛋️"
    - "Sunday, {when} is general conference. Downloading wisdom… please stand by. No {org} lesson."

# The last line of every message.
signoffs:
  - "Beep boop. See you Sunday!"
  - "Boop. 🤖"
  - "Have a great week, humans. Beep!"
  - "End of message. *happy beeping*"
  - "Beep boop beep. (Translation: read the talk!)"
  - "Shutting down… just kidding. Beep boop! 👋"
