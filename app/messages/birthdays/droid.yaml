# A birthday message style. One message is picked at random.
# To add a one-line message, add another - "..." row and keep the double quotes.
# For several lines, use - |- and indent the text under it, like the ones in trailer.yaml.
# Fill-ins: {names} Ann Apple and Bo Birch, {NAMES} the same in capitals, {legend} legend or legends,
# {s} the verb ending (continue{s}), {is} is or are, {has} has or have, {was} was or were.
# Wards have the file name (droid) saved, so don't rename this file.

name: "Battle droid"
order: 4  # position in the list on the Birthdays page

messages:
  - "🤖 Roger roger. Scanning ward records… birthday detected: {names}. Deploying cake. 🎂"
  - "🤖 Attention all units: {names} {is} now one year older. Orders are to celebrate. Roger roger. 🎉"
  - "🤖 Roger roger. Happy birthday, {names}. This message will not self-destruct. 🎂"
